name: Publish to JSR

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v5

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Run tests
              run: deno test

            - name: Publish to JSR
              run: npx jsr publish
